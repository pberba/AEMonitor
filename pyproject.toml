[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aemonitor"
version = "0.1.1"
description = "Apple Events Monitor — stream and parse Apple Events from macOS debug unified logs"
authors = [{name = "pberba"}]
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10"
dependencies = [
    "applescript-decompiler @ git+https://github.com/pberba/applescript-decompiler.git@v1.0.2",
]

[project.scripts]
aemonitor = "aemonitor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
native = ["pyobjc-core>=10", "pyobjc-framework-Cocoa>=10"]

[dependency-groups]
# Build AEMonitor.app: uv run --group app pyinstaller --noconfirm aemonitor/app/AEMonitor.spec
app = ["aemonitor[native]", "pyinstaller>=6.10"]

[tool.uv]
# uv uses standard pyproject.toml; uv sync / uv run work with the git dependency above

[project.urls]
Homepage = "https://github.com/pberba/AEMonitor"
Repository = "https://github.com/pberba/AEMonitor"

[tool.setuptools.packages.find]
where = ["."]
include = ["aemonitor*"]
